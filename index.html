function createDatabaseItem(text, statusClass, statusText) {
    const li = document.createElement('li');
    li.textContent = text + ' ';
    
    const badge = document.createElement('span');
    badge.className = `badge ${statusClass}`;
    badge.textContent = statusText;
    
    li.appendChild(badge);
    return li;
}

// ==========================================
function renderNews(data) {
    const feed = document.getElementById('news-feed');
    if (!feed) return;
    
    feed.innerHTML = '';
    
    if (!data) {
        feed.innerHTML = DICTIONARY.newsEmpty;
        return;
    }

    const canEdit = activeUser && (activeUser.role === 'chief' || activeUser.rank === 'Заместитель начальника Управления');

    Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        const deleteButtonHtml = canEdit ? `<button onclick="deleteNews('${key}')" class="btn-delete">Удалить</button>` : '';
        
        feed.innerHTML += `
            <div class="card">
                ${deleteButtonHtml}
                <h3>${item.title}</h3>
                <p><small>Игровая дата: ${item.date} | <strong>Подпись: ${item.author}</strong></small></p>
                <p>${item.text}</p>
            </div>
        `;
    });
}

/**
 * Рендеринг заявлений от гражданских лиц
 */
function renderCivils(data) {
    const civilsPanelBlock = document.getElementById('civils-panel-block');
    const canEdit = activeUser && (activeUser.role === 'chief' || activeUser.rank === 'Заместитель начальника Управления');
    
    if (civilsPanelBlock) {
        civilsPanelBlock.style.setProperty('display', canEdit ? 'block' : 'none', 'important');
    }
    
    const civFeed = document.getElementById('civils-feed');
    if (!civFeed) return;
    civFeed.innerHTML = '';
    
    if (!canEdit) return;
    
    if (!data) {
        civFeed.innerHTML = 'Заявлений от игроков не зарегистрировано.';
        return;
    }
    
    Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        const proofHtml = item.proof ? `<p>🔗 <strong>Доказательства:</strong> <a href="${item.proof}" target="_blank">${item.proof}</a></p>` : '';
        
        civFeed.innerHTML += `
            <div class="card alert-card"> 
                <button class="btn-danger delete-btn" style="display:block;" onclick="globalDelete('civils', '${key}')">Архивировать</button> 
                <h3>${item.type} (Игрок: ${item.fio})</h3> 
                <p><strong>Связь:</strong> ${item.contact}</p> 
                <p>${item.text}</p> 
                ${proofHtml} 
                <span class="badge blue">RP-Статус: На рассмотрении</span> 
            </div>
        `;
    });
}

/**
 * Рендеринг списка лиц, находящихся в розыске
 */
function renderWanted(data) {
    const wantedList = document.getElementById('wanted-list');
    if (!wantedList) return;
    wantedList.innerHTML = '';
    
    if (!data) return;
    
    const canEdit = activeUser && (activeUser.role === 'chief' || activeUser.rank === 'Заместитель начальника Управления');
    
    Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        const deleteBtn = canEdit ? `<button onclick="globalDelete('wanted', '${key}')" style="background:none; border:none; cursor:pointer; margin-left:5px;">❌</button>` : '';
        
        wantedList.innerHTML += `
            <li>
                <span>${item.name}</span> 
                <div>
                    <span class="badge red" style="margin-right:5px;">${item.reason}</span>
                    ${deleteBtn}
                </div>
            </li>
        `;
    });
}

/**
 * Рендеринг следственных дел и улик фракции
 */
function renderEvidence(data) {
    const evFeed = document.getElementById('evidence-list-feed');
    if (!evFeed) return;
    evFeed.innerHTML = '';
    
    if (!activeUser) return;
    
    if (!data) {
        evFeed.innerHTML = 'Следственные дела отсутствуют.';
        return;
    }
    
    const canEdit = activeUser && (activeUser.role === 'chief' || activeUser.rank === 'Заместитель начальника Управления');
    
    Object.keys(data).reverse().forEach(key => {
        const item = data[key];
        const deleteBtn = canEdit ? `<button class="btn-danger" onclick="globalDelete('evidence', '${key}')" style="margin-bottom:10px;">Стереть</button>` : '';
        
        evFeed.innerHTML += `
            <div class="card case-card"> 
                ${deleteBtn} 
                <h3>Материалы: ${item.case}</h3> 
                <p><small>Следователь: <strong>${item.by}</strong></small></p> 
                <p>${item.desc}</p> 
                <span class="badge purple">${item.status}</span> 
            </div>
        `;
    });
}

/**
 * Рендеринг чата служебной рации УСБ
 */
function renderChat(data) {
    const box = document.getElementById('chat-box');
    if (!box) return;
    box.innerHTML = '';
    
    if (!data) return;
    
    Object.keys(data).forEach(key => {
        const m = data[key];
        const color = m.sender === "IgnatebaAE" ? "var(--alert-red)" : "var(--mvd-gold)";
        
        box.innerHTML += `
            <div>
                <span style="color: var(--text-muted); font-size: 10px;">[${m.time}]</span> 
                <strong style="color: ${color}">${m.sender}:</strong> 
                <span style="color: #fff">${m.text}</span>
            </div>
        `;
    });
    box.scrollTop = box.scrollHeight;
}

/**
 * Авторизация в дежурной части
 */
function login() {
    const uName = document.getElementById('login-username').value.trim();
    const uPass = document.getElementById('login-pass').value.trim();
    const user = localDB.users.find(x => x.username === uName && x.pass === uPass);
    
    if (user) {
        activeUser = user;
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('logout-btn').style.display = 'block';
        document.getElementById('chief-panel').style.display = 'block';
        document.getElementById('evidence-locked-msg').style.display = 'none';
        document.getElementById('evidence-content').style.display = 'block';
        
        const authStatusText = document.getElementById('auth-status-text');
        authStatusText.innerText = `ДОСТУП: РУКОВОДСТВО [${user.username}]`;
        authStatusText.style.color = 'var(--alert-red)';
        
        db.ref('news').once('value', snapshot => renderNews(snapshot.val()));
        db.ref('civils').once('value', snapshot => renderCivils(snapshot.val()));
        
        alert(`Вход выполнен успешно, товарищ Полковник!`);
    } else {
        alert('ОТКАЗ В ДОСТУПЕ! Проверьте служебный логин или пароль.');
    }
}

/**
 * Завершение дежурства (выход)
 */
function logout() {
    activeUser = null;
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('logout-btn').style.display = 'none';
    document.getElementById('chief-panel').style.display = 'none';
    
    const authStatusText = document.getElementById('auth-status-text');
    authStatusText.innerText = 'Статус доступа: Гражданское лицо';
    authStatusText.style.color = 'var(--text-muted)';
    
    document.getElementById('evidence-locked-msg').style.display = 'block';
    document.getElementById('evidence-content').style.display = 'none';
    
    db.ref('civils').once('value', snapshot => renderCivils(snapshot.val()));
}

/**
 * Направление рапорта/жалобы в базу данных
 */
function submitCivilForm() {
    const type = document.getElementById('civ-type').value;
    const fio = document.getElementById('civ-fio').value.trim();
    const contact = document.getElementById('civ-contact').value.trim();
    const text = document.getElementById('civ-text').value.trim();
    const proof = document.getElementById('civ-proof').value.trim();
    
    if (!fio || !text || !contact) {
        return alert('Пожалуйста, заполните форму рапорта полностью!');
    }
    
    db.ref('civils').push({ type, fio, contact, text, proof });
    
    document.getElementById('civ-fio').value = '';
    document.getElementById('civ-contact').value = '';
    document.getElementById('civ-text').value = '';
    document.getElementById('civ-proof').value = '';
    
    alert('Рапорт успешно направлен в базу Google Firebase!');
}

/**
 * Смена имени начальника управления
 */
function changeChiefName() {
    const name = document.getElementById('new-chief-name').value.trim();
    if (!name) return;
    
    db.ref('chief').set(name);
    document.getElementById('new-chief-name').value = '';
    alert('Данные руководителя фракции обновлены.');
}

/**
 * Изменение статуса дежурной части фракции
 */
function changeDcStatus() {
    const val = document.getElementById('dc-status-select').value;
    db.ref('dc_status').set(val);
}

/**
 * Создание и публикация официального пресс-релиза
 */
function createPost() {
    const title = document.getElementById('post-title').value.trim();
    const text = document.getElementById('post-text').value.trim();
    
    if (!title || !text) {
        return alert('Заполните заголовок и текст пресс-релиза!');
    }
    
    db.ref('news').push({
        title: title,
        text: text,
        author: activeUser.username,
        date: new Date().toLocaleDateString()
    });
    
    document.getElementById('post-title').value = '';
    document.getElementById('post-text').value = '';
    alert('Официальный пресс-релиз опубликован!');
}

/**
 * Внесение игрока в Федеральный Розыск МВД
 */
function createWanted() {
    const name = document.getElementById('wanted-name').value.trim();
    const reason = document.getElementById('wanted-reason').value.trim();
    
    if (!name || !reason) {
        return alert('Заполните карточку розыска подозреваемого!');
    }
    
    db.ref('wanted').push({ name, reason });
    
    document.getElementById('wanted-name').value = '';
    document.getElementById('wanted-reason').value = '';
    alert('Подозреваемый внесен в Федеральный Розыск МВД!');
}

/**
 * Регистрация нового следственного дела и улик в архив
 */
function addEvidence() {
    const caseName = document.getElementById('ev-case').value.trim();
    const status = document.getElementById('ev-status').value;
    const desc = document.getElementById('ev-desc').value.trim();
    
    if (!caseName || !desc) {
        return alert('Заполните данные дела!');
    }
    
    db.ref('evidence').push({ case: caseName, status, desc, by: activeUser.username });
    
    document.getElementById('ev-case').value = '';
    document.getElementById('ev-desc').value = '';
    alert('Следственное дело запечатано в архив!');
}

/**
 * Глобальная функция удаления записей из Firebase по путям
 */
function globalDelete(path, key) {
    if (!confirm('Вы действительно хотите удалить эту запись из базы данных?')) return;
    db.ref(path).child(key).remove();
}

/**
 * Локальное переключение статуса приема обращений
 */
function applyDcStatus(status) {
    const dot = document.getElementById('dc-status-dot');
    const text = document.getElementById('dc-status-text');
    if (!dot || !text) return;
    
    if (status === 'open') { 
    if (status === 'open') {
        dot.style.backgroundColor = 'var(--success-green)';
        text.innerText = 'Прием обращений [ИГРА]';
    } else {
        dot.style.backgroundColor = 'var(--alert-red)';
        text.innerText = 'Режим ограничений [ФРАКЦИЯ]';

}
